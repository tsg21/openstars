[project]
name = "openstars"
version = "0.1.0"
description = "OpenStars! backend — turn-based 4X space strategy"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.10",
    "python-json-logger>=4.1.0",
    "google-cloud-storage>=3.1.1",
    "pyyaml>=6.0.3",
    "firebase-admin>=7.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "httpx>=0.28",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pygments>=2.20.0",
    "requests>=2.33.0",
]
