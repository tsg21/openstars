name: Build Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-frontend.yml'

env:
  PROJECT_ID: openstars
  PROJECT_NUMBER: 1044626254790
  REGION: europe-west1
  REGISTRY: europe-west1-docker.pkg.dev
  REPOSITORY: openstars-frontend
  IMAGE_NAME: frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Required for Workload Identity Federation

    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-actions@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Generate timestamp
        id: timestamp
        run: echo "iso_timestamp=$(date -u +%Y-%m-%dT%H-%M-%SZ)" >> $GITHUB_OUTPUT

      - name: Get Firebase web app config
        id: firebase_config
        run: |
          TOKEN=$(gcloud auth print-access-token)
          APP_ID=$(curl -s -H "Authorization: Bearer ${TOKEN}" \
            -H "X-Goog-User-Project: ${{ env.PROJECT_ID }}" \
            "https://firebase.googleapis.com/v1beta1/projects/${{ env.PROJECT_ID }}/webApps" \
            | jq -r '.apps[0].appId')
          CONFIG=$(curl -s -H "Authorization: Bearer ${TOKEN}" \
            -H "X-Goog-User-Project: ${{ env.PROJECT_ID }}" \
            "https://firebase.googleapis.com/v1beta1/projects/${{ env.PROJECT_ID }}/webApps/${APP_ID}/config")
          echo "api_key=$(echo "$CONFIG" | jq -r .apiKey)" >> $GITHUB_OUTPUT
          echo "auth_domain=$(echo "$CONFIG" | jq -r .authDomain)" >> $GITHUB_OUTPUT

      - name: Build and push image
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          docker build --quiet \
            --build-arg VITE_FIREBASE_API_KEY=${{ steps.firebase_config.outputs.api_key }} \
            --build-arg VITE_FIREBASE_PROJECT_ID=${{ env.PROJECT_ID }} \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN=${{ steps.firebase_config.outputs.auth_domain }} \
            -t ${IMAGE}:${{ steps.timestamp.outputs.iso_timestamp }} ./frontend
          docker push --quiet ${IMAGE}:${{ steps.timestamp.outputs.iso_timestamp }}
