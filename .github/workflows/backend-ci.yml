name: Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --extra dev --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --extra dev --group dev

      - name: Start backend container
        run: docker compose -f int_tests/docker-compose.yaml up -d --build --wait --quiet-pull

      - name: Run integration tests
        run: uv run pytest int_tests/ -v --tb=short

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f int_tests/docker-compose.yaml logs --no-color

      - name: Tear down containers
        if: always()
        run: docker compose -f int_tests/docker-compose.yaml down -v --remove-orphans
